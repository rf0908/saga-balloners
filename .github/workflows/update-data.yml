name: Update Match Data

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でも実行可能

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch schedule
        run: python scripts/fetch_schedule.py --save

      - name: Scrape standings
        run: python scripts/scrape_standings.py --save

      - name: Scrape player stats
        run: python scripts/scrape_player_stats.py --save

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet && echo "No changes" || (git commit -m "chore: update match data [skip ci]" && git push)
